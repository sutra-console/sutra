[package]
name = "sutra"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "sutra" # the app; sutra-extcap is the Wireshark capture helper

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sutra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
rmcp = { version = "0.16", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-util = "0.7"
btleplug = "0.11"        # BLE central (CoreBluetooth / WinRT / BlueZ)
uuid = "1"               # GATT service/characteristic UUIDs
futures = "0.3"          # notification / message streams
tokio-tungstenite = "0.24" # WebSocket client (network transport; ws://, wss via a TLS feature)
mdns-sd = "0.13"         # LAN auto-discovery: browse the _skrit._tcp services Dutas advertise
tungstenite = "0.24"     # sync WS client for the sutra-extcap bin (Wireshark capture)
rtshark = "4"            # drive tshark for Zigbee/Thread/Matter dissection (optional; bonus)
aes = "0.8"              # AES-128 block cipher for Zigbee NWK/APS security (phase B)
ccm = "0.5"              # CCM* AEAD (encrypt + 32-bit MIC) over AES-128, the Zigbee construction
serde_yaml = "0.9"       # parse .yantra device-control surfaces (YAML → JSON passthrough)
age = { version = "0.11", features = ["ssh"] } # at-rest secret encryption (multi-recipient: passphrase + X25519 app key; ssh recipients in phase B). SecretString via age::secrecy re-export.
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] } # yantra scripting: sandboxed Lua VM per control surface (send = Send VM for managed state; serialize = serde↔Lua; vendored = bundled Lua C)

[[bin]]
name = "sutra-extcap"
path = "src/bin/sutra_extcap.rs"

