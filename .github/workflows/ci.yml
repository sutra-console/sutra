name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---- frontend: wasm runtime + typecheck + vite build ----
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # `bun run build` builds yantra-wasm (egui→wasm) first, so the runner
      # needs the Rust wasm toolchain + wasm-pack.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yantra-wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: bun install --frozen-lockfile
      - run: bun run build # wasm-pack + tsc + vite build

  # ---- backend: protocol/serial/mcp unit tests ----
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        run: cargo test --lib
        working-directory: src-tauri
      - name: Lint (warnings are errors)
        run: cargo clippy --lib -- -D warnings
        working-directory: src-tauri
