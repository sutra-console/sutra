[package]
name = "yantra-wasm"
version = "0.1.0"
edition = "2021"
publish = false
# Standalone crate (NOT in the src-tauri workspace) → browser WASM
# (wasm32-unknown-unknown). Path B spike: egui renders the yantra surface in the
# webview; logic stays in the app's native mlua backend (over Tauri). This crate
# is render + input only.

[lib]
crate-type = ["cdylib"]

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] } # wasm32 entropy for egui's deps

[profile.release]
opt-level = "s" # smaller wasm

[workspace]
